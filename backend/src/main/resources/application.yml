spring:
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/interop
    username: user
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  graphql:
    graphiql:
      enabled: true

server:
  port: 8080

tags:
  api:
    mode: custom
#mode public: use the public tags from the interop repository

jwt:
  access-minutes: 15
  refresh-days: 7

app:
  generated-xml: generated/tags.xml
