<!DOCTYPE html>
<html lang="hr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: okvir('JAXB validacija', ~{::main/content()})}">
<body>
<main>

    <div class="greska" th:if="${greska}" th:text="${greska}"></div>

    <form th:action="@{/jaxb}" method="post" class="kartica">
        <label>
            <input type="checkbox" name="regeneriraj" value="true">
            Prije validacije ponovno dohvati oznake iz Asane i prepisi datoteku
        </label>

        <button type="submit">Validiraj</button>
    </form>

    <section class="kartica" th:if="${rezultat}">
        <h2 th:if="${rezultat.valid()}">Datoteka je ispravna</h2>
        <h2 th:unless="${rezultat.valid()}">Datoteka nije ispravna</h2>

        <table class="podaci">
            <tr><th>Datoteka</th><td><code th:text="${rezultat.file()}">-</code></td></tr>
            <tr><th>Unmarshallano oznaka</th><td th:text="${rezultat.tagCount()}">0</td></tr>
            <tr><th>Broj prekrsaja</th><td th:text="${#lists.size(rezultat.errors())}">0</td></tr>
        </table>

        <div th:replace="~{fragments/greske :: tablica(${rezultat.errors()})}"></div>
    </section>

</main>
</body>
</html>
