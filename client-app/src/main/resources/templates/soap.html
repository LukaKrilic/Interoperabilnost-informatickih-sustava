<!DOCTYPE html>
<html lang="hr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: okvir('SOAP pretraga', ~{::main/content()})}">
<body>
<main>

    <div class="greska" th:if="${greska}" th:text="${greska}"></div>

    <form th:action="@{/soap}" method="post" class="kartica">
        <label for="pojam">Pojam za pretragu</label>
        <input type="text" id="pojam" name="pojam" th:value="${pojam}"
               placeholder="npr. urgent, SKOL, qqqzzz">
        <button type="submit">Pretrazi</button>
    </form>

    <section class="kartica" th:if="${odgovor}">
        <h2>Rezultat</h2>

        <table class="podaci">
            <tr><th>Generirana datoteka</th><td><code th:text="${odgovor.generatedFile}">-</code></td></tr>
            <tr><th>Oznaka u datoteci</th><td th:text="${odgovor.totalInFile}">0</td></tr>
            <tr><th>Pogodaka</th><td th:text="${odgovor.matchCount}">0</td></tr>
        </table>

        <table class="popis" th:if="${odgovor.matchCount > 0}">
            <thead>
            <tr><th>gid</th><th>Naziv</th><th>Boja</th><th>Biljeske</th><th>Workspace</th></tr>
            </thead>
            <tbody>
            <tr th:each="t : ${odgovor.tag}">
                <td><code th:text="${t.gid}">-</code></td>
                <td th:text="${t.name}">naziv</td>
                <td th:text="${t.color}"></td>
                <td th:text="${t.notes}"></td>
            </tr>
            </tbody>
        </table>
    </section>

</main>
</body>
</html>
