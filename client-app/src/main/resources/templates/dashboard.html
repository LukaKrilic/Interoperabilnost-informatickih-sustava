<!DOCTYPE html>
<html lang="hr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: okvir('Nadzorna ploca', ~{::main/content()})}">
<body>
<main>

    <div class="poruka" th:if="${poruka}" th:text="${poruka}"></div>
    <div class="greska" th:if="${greska}" th:text="${greska}"></div>

    <section class="kartica">
        <h2>Prijavljeni korisnik</h2>
        <table class="podaci">
            <tr><th>Korisnik</th><td th:text="${tokens?.username}">-</td></tr>
            <tr><th>Uloga</th><td th:text="${tokens?.role}">-</td></tr>
            <tr><th>Access token</th><td><code th:text="${accessTokenPreview}">-</code></td></tr>
            <tr><th>Refresh token</th><td><code th:text="${refreshTokenPreview}">-</code></td></tr>
            <tr><th>Access vrijedi</th><td th:text="|${tokens?.accessMinutes} min|">-</td></tr>
        </table>

        <form th:action="@{/token/refresh}" method="post" class="inline">
            <button type="submit">Osvjezi token</button>
        </form>
    </section>
</main>
</body>
</html>
