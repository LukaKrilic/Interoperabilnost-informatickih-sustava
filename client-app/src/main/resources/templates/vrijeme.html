<!DOCTYPE html>
<html lang="hr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: okvir('Vrijeme (gRPC)', ~{::main/content()})}">
<body>
<main>

    <div class="greska" th:if="${greska}" th:text="${greska}"></div>

    <form th:action="@{/vrijeme}" method="post" class="kartica">
        <label for="grad">Naziv grada ili dio naziva</label>
        <input type="text" id="grad" name="grad" th:value="${grad}"
               placeholder="npr. zagre, sib, split">

        <button type="submit">Dohvati temperature</button>
    </form>

    <section class="kartica" th:if="${odgovor}">
        <h2>Rezultat</h2>

        <table class="podaci">
            <tr><th>Izvor</th><td><code th:text="${odgovor.source}">-</code></td></tr>
            <tr><th>Mjereno</th><td th:text="${odgovor.measuredAt}">-</td></tr>
            <tr><th>Postaja u izvještaju</th><td th:text="${odgovor.totalCities}">0</td></tr>
            <tr><th>Pogodaka</th><td th:text="${odgovor.matchCount}">0</td></tr>
        </table>

        <table class="popis" th:if="${odgovor.matchCount > 0}">
            <thead>
            <tr><th>Postaja</th><th>Temperatura</th></tr>
            </thead>
            <tbody>
            <tr th:each="g : ${odgovor.cityList}">
                <td th:text="${g.name}">grad</td>
                <td th:if="${g.hasTemperatureC()}" th:text="|${g.temperatureC} °C|">-</td>
            </tr>
            </tbody>
        </table>
    </section>

</main>
</body>
</html>
