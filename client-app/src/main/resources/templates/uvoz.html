<!DOCTYPE html>
<html lang="hr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: okvir('Uvoz XML / JSON', ~{::main/content()})}">
<body>
<main>

    <div class="greska" th:if="${greska}" th:text="${greska}"></div>

    <form th:action="@{/uvoz}" method="post" enctype="multipart/form-data" class="kartica">
        <label for="datoteka">Datoteka s oznakama (.xml ili .json)</label>
        <input type="file" id="datoteka" name="datoteka" accept=".xml,.json" required>
        <button type="submit">Posalji na validaciju</button>
    </form>

    <section class="kartica" th:if="${rezultat}">
        <h2 th:if="${rezultat.valid()}">Uvoz uspjesan</h2>
        <h2 th:unless="${rezultat.valid()}">Validacija nije prosla</h2>

        <p th:if="${rezultat.valid()}">
            Datoteka <code th:text="${imeDatoteke}"></code> je ispravna,
            spremljeno oznaka: <strong th:text="${rezultat.imported()}">0</strong>.
        </p>
        <p th:unless="${rezultat.valid()}">
            Datoteka <code th:text="${imeDatoteke}"></code> je odbijena.
            <strong>Nijedan zapis nije spremljen u bazu.</strong>
        </p>

        <div th:replace="~{fragments/greske :: tablica(${rezultat.errors()})}"></div>
    </section>

</main>
</body>
</html>
